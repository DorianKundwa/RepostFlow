# RepostFlow Production Nginx Reverse Proxy Configuration
# Place in /etc/nginx/sites-available/repostflow and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name repostflow.yourdomain.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name repostflow.yourdomain.com;

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/repostflow.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/repostflow.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Large Video Uploads (support up to 4GB video masters)
    client_max_body_size 4096M;
    client_body_timeout 300s;
    proxy_read_timeout 600s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;

    # Static Assets Caching
    location /static/ {
        alias /opt/repostflow/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Reverse Proxy to Flask/WSGI Backend
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & Streaming Buffering Off for real-time progress
        proxy_buffering off;
        proxy_http_version 1.1;
    }
}
