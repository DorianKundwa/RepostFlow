{% extends "base.html" %}
{% block title %}Login · RepostFlow{% endblock %}

{% block content %}
<div class="rf-auth-card">
  <div class="rf-auth-logo">
    <i class="bi bi-play-circle-fill rf-logo-icon-lg"></i>
    <h1 class="rf-auth-title">RepostFlow</h1>
    <p class="rf-auth-subtitle">Upload Once. Distribute Everywhere.</p>
  </div>

  <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-person"></i></span>
        <input type="text" class="form-control" id="username" name="username"
               placeholder="Enter your username" required autofocus />
      </div>
    </div>

    <div class="mb-4">
      <label for="password" class="form-label">Password</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" class="form-control" id="password" name="password"
               placeholder="Enter your password" required />
      </div>
    </div>

    <button type="submit" class="btn btn-rf-primary w-100 mb-3">
      <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
    </button>
  </form>

  {% if no_users %}
  <div class="text-center">
    <span class="text-muted small">No account yet? </span>
    <a href="{{ url_for('auth.register') }}" class="rf-link-red small">Create your account</a>
  </div>
  {% endif %}
</div>
{% endblock %}
